/* LEXSAN / Diseño operativo V4 */
:root{--orange:#f45227;--orange-light:#fff1eb;--ink:#142235;--muted:#64748b;--line:#e5eaf0;--paper:#fff;--bg:#f3f6fa;--good:#15855f;--goodlight:#e7f5ed;--amber:#ac6c17;--amberlight:#fff5df;--red:#bf4343;--shadow:0 7px 25px rgba(14,32,55,.035)}
*{scrollbar-color:#cbd4df transparent}
body{font-family:Inter,'Segoe UI',Arial,sans-serif;color:var(--ink);font-size:14px;background:var(--bg);-webkit-font-smoothing:antialiased}
.shell{min-height:100vh}
.rail{width:248px;background:#101b2b;padding:25px 15px 21px;gap:7px;border-right:1px solid #15263e;position:sticky;top:0;height:100vh}
.brand{gap:11px;padding:2px 11px 31px;border-bottom:1px solid rgba(255,255,255,.11);margin-bottom:20px}
.brand img{width:46px;height:50px;border-radius:10px;background:#fff;padding:5px;box-shadow:0 3px 10px #0002}
.brand b{font-size:18px;letter-spacing:.6px;line-height:1}
.brand small{font-size:9px;color:#93a5b9;letter-spacing:1.15px;margin-top:6px}
.menu-group{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;color:#75869c;padding:7px 16px 6px;font-weight:800}
.nav{padding:13px 15px;display:flex;align-items:center;gap:12px;color:#aebdd0;font-weight:650;font-size:13px;border-radius:10px;transition:.2s;border-left:3px solid transparent}
.nav:hover{color:#fff;background:#1c2b3e}
.nav.selected{background:#263142;color:#fff;border-left-color:var(--orange);box-shadow:inset 0 0 0 1px #ffffff08}
.nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rail-bottom{border-top:1px solid #273549;color:#91a0b4;padding:16px 12px 0;font-size:10px;margin-top:auto}
.rail-bottom .rail-environment{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:650;margin-bottom:10px;color:#aebfd3}
.pulse{width:7px;height:7px;border-radius:50%;background:#e5a24c;display:inline-block}
.rail-bottom button{border:1px solid #354356!important;color:#b4c3d6!important;background:transparent!important;width:100%;text-align:left!important;margin:0 0 12px;padding:8px 11px!important}
.workspace{background:var(--bg)}
.topbar{height:76px;padding:0 38px;background:#fff;border-bottom:1px solid #e8edf4;box-shadow:0 2px 16px #15243905}
.topbar .path{color:#8a96a7;font-size:11px;letter-spacing:.15px;margin-bottom:3px}
.topbar .title{font-size:15px;font-weight:800}
.top-actions{gap:18px}.top-actions .system-tag{border:1px solid #e1e9f0;background:#f8fafc;color:#6f8193;border-radius:30px;padding:7px 11px;font-size:11px;font-weight:700;display:flex;gap:7px;align-items:center}
.system-tag:before{content:'';width:6px;height:6px;background:#e59b35;border-radius:50%;display:block}
.profile{font-weight:700;font-size:12px;color:#142235;min-width:135px;border-color:#e3e8ef;border-radius:10px;padding:10px 12px}
.content{max-width:1470px;padding:32px 38px 65px}
.button{border-radius:9px;padding:11px 16px;font-size:13px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;white-space:normal;transition:background .15s, box-shadow .15s,transform .15s}
.button:hover:not(:disabled){box-shadow:0 5px 15px #f4522720;transform:translateY(-1px)}
.button.outline{color:#26384a;border-color:#dfe5ec}.button.outline:hover{border-color:#f5a990;background:#fff8f5}
.button.soft{background:#fff0e9;border:1px solid #ffdacb;color:#b84625}
.button.dark{background:#1c2d41}.button.sm{padding:8px 11px;font-size:11px}
.button svg,.action-card svg,.file-action svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none}
.button.icon-only{width:32px;height:32px;padding:6px;flex:none}
.hero{padding:27px 32px;min-height:158px;border-radius:17px;background:radial-gradient(ellipse at 96% 10%,rgba(242,82,39,.22),transparent 35%),linear-gradient(112deg,#152236 0%,#25364b 100%);box-shadow:0 14px 36px #192f4a18;position:relative;margin:0 0 20px;isolation:isolate;overflow:hidden}
.hero:before{content:'';position:absolute;right:20px;top:-50px;width:340px;height:270px;opacity:.10;transform:rotate(-23deg);background:repeating-linear-gradient(90deg,#fff 0,#fff 2px,transparent 2px,transparent 14px);border-radius:18px;z-index:-1}
.hero:after{content:'';position:absolute;top:0;left:0;width:5px;height:100%;background:var(--orange)}
.hero h1{font-size:31px;font-weight:850;letter-spacing:-.9px;line-height:1.1}
.hero p{font-size:13px;color:#c3d0e2;margin-top:10px;max-width:550px}
.hero .eyebrow{color:#fd926e;margin-bottom:11px;letter-spacing:1.6px}
.hero .button{background:var(--orange);border-color:var(--orange);font-size:13px;padding:14px 17px;box-shadow:0 6px 18px #0d0d0d22}
.tilegrid{margin-bottom:26px;gap:13px}
.tile,.action-card{display:flex;align-items:center;min-height:100px;gap:15px;background:#fff;border:1px solid #e3e9f1;border-radius:14px;box-shadow:0 4px 16px #243d5c08;padding:20px;text-align:left;position:relative;transition:border .15s, transform .15s, box-shadow .15s}
.tile:hover,.action-card:hover{border-color:#ffa98c;box-shadow:0 10px 25px #1b30430f;transform:translateY(-2px)}
.tile-icon,.action-icon{width:51px;height:51px;display:flex;align-items:center;justify-content:center;background:#fff0e9;color:var(--orange);border-radius:12px;flex:none}
.tile-icon svg,.action-icon svg{height:24px;width:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tile b,.action-card b{font-size:14px;font-weight:800;letter-spacing:-.1px}
.tile small,.action-card small{font-size:11px;color:#8592a2;margin-top:5px;display:block}
.tile:after{content:'›';font-size:22px;color:#becbd8;position:absolute;right:16px;top:30px}
.metricgrid{gap:12px;margin:0 0 26px}
.metric{border:1px solid #e4e9f0;box-shadow:0 5px 18px #1b304306;border-radius:13px;padding:17px 20px 16px;position:relative;overflow:hidden;min-height:120px}
.metric:before{content:'';width:29px;height:4px;display:block;background:#f45227;border-radius:10px;margin-bottom:13px}
.metric:nth-child(2):before{background:#e3a94c}.metric:nth-child(3):before{background:#4685c1}.metric:nth-child(4):before{background:#4b9f87}
.metric span{font-size:12px;color:#738298;letter-spacing:.0px;font-weight:650}
.metric div{font-size:30px;font-weight:860;letter-spacing:-1px;margin:2px 0 0;line-height:1.25}
.section-head{margin:24px 0 14px}.section-head h2{font-size:19px;font-weight:820;letter-spacing:-.4px}.section-head h1{font-size:29px;letter-spacing:-.6px}
.section-head .sub,.section-head p{font-size:12px;color:#8893a3}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:18px;align-items:start}
.dashboard-side{display:grid;gap:14px;padding-top:60px}
.side-panel{background:#fff;border:1px solid #e4e9f0;border-radius:14px;padding:19px;box-shadow:0 6px 24px #1b304307}
.side-panel h3{font-size:14px;font-weight:790;margin-bottom:7px}.side-panel p{font-size:11px;line-height:1.5}
.side-panel>.row>svg{width:18px;height:18px;stroke:var(--orange);fill:none;stroke-width:1.7;flex:none}.top-actions .system-tag{white-space:nowrap}.ticket-id{white-space:nowrap}.doc-shortcut{width:100%;border:1px solid #e5eaf0;background:#fff;border-radius:10px;margin-top:11px;padding:12px 11px;display:flex;gap:9px;align-items:center;text-align:left;cursor:pointer;color:#273448}
.doc-shortcut:hover{border-color:#f3a080;background:#fffaf8}
.doc-shortcut svg{width:19px;height:19px;stroke:var(--orange);fill:none;stroke-width:1.8;flex:none}
.doc-shortcut b{font-size:11.5px;display:block}.doc-shortcut small{font-size:10px;color:#8a97a5;display:block;margin-top:3px}
.doc-shortcut .download{margin-left:auto;color:#9eabba;font-size:18px}
.tablebox,.card{border:1px solid #e3e9f0;border-radius:13px;box-shadow:0 4px 18px #1b304307}
.tablebox th{background:#f8fafc;font-size:10px;color:#7d8a9a;letter-spacing:.95px;padding:15px 17px}
.tablebox td{padding:15px 17px;font-size:12px;color:#27394c;border-bottom:1px solid #edf1f4}
.tablebox .namecell b{font-size:12px;line-height:1.35;font-weight:800}.tablebox .namecell small{margin-top:5px}
tr.clickable:hover{background:#fffaf6!important}
.ticket-id{font-weight:860;letter-spacing:.05px;color:#152437;font-size:12px}
.id-dot{width:5px;height:5px;border-radius:50%;background:var(--orange);display:inline-block;margin-right:8px;vertical-align:middle}
.table-action{font-size:11px;color:#50637a;font-weight:660;max-width:185px}
.tag{font-size:10px;padding:7px 10px;font-weight:750;letter-spacing:.05px}
.tag.orange{background:#fff0e8;color:#bf4a21}.tag.amber{background:#fff4dc;color:#986119}.tag.green{background:#e5f6ed;color:#1e835a}
.tag.red{background:#ffeeed;color:#bb4040}
.footer-note{font-size:10px;color:#8c9aa9;padding:10px 0}
input[type=text],input[type=number],input[type=email],input[type=date],select,textarea,.input{border:1px solid #dce3ea;border-radius:9px;padding:11px 12px;font-size:13px;color:#27394c}
input:focus,select:focus,textarea:focus{border-color:#f6a083;box-shadow:0 0 0 3px #f4522717}
label{color:#617185;font-size:11px;font-weight:750;letter-spacing:.05px}
.modal-cover{background:rgba(7,19,35,.62);backdrop-filter:blur(2px)}.modal{width:min(995px,100%);border-radius:18px;box-shadow:0 30px 100px #050e1e5c}
.modal-head{padding:23px 30px 20px}.modal-body{padding:23px 30px 31px}.modal-head h2{font-size:23px}.modal-head p{margin-top:6px;color:#8795a5}
.xbtn{width:38px;height:38px;color:#8b97a8;border-color:#e5eaf1;font-size:24px}.xbtn:hover{background:#fff2ec;color:#cf4b1a}
.tabs{gap:5px;margin:0 0 23px;padding-bottom:11px}
.tabs button{font-size:11.5px;padding:10px 13px;color:#718196;border-radius:9px}.tabs button.on{background:#fff0e8;color:#b84523}
.steps{gap:4px;margin:0 0 23px}.step{padding:12px 1px;font-size:10px;border-bottom:3px solid #e9eef4}.step.done{color:#248966}.step.current{color:#cf552e}
.detail{background:#fafbfc;border:1px solid #e7edf3;border-radius:12px;padding:18px}
.detail dt{font-size:10px;color:#8491a0}.detail dd{font-size:12px;color:#17283c}
.quotegrid{grid-template-columns:minmax(0,1.45fr) minmax(240px,.55fr)}
.totalrow.big{color:#ea552b;font-size:22px}
.operation-choice{border-color:#e0e7ef;border-radius:11px;min-height:100px}
.operation-choice:has(input:checked){background:#fff6f1;border-color:#f49b78;box-shadow:0 0 0 2px #f4522711}
.hint{border:1px solid #f9dfd2;border-left:3px solid #f45227;background:#fffaf7;color:#7b5847;border-radius:8px}
.goodhint{background:#f0f9f3;border-color:#d5eadf;border-left-color:#2b996c;color:#38664f}
#toast{background:#1b2c3d;border-radius:10px;padding:14px 18px;font-size:12px}
@media(max-width:1240px){.dashboard-grid{grid-template-columns:minmax(0,1fr)}.dashboard-side{grid-template-columns:repeat(2,minmax(0,1fr));padding-top:0}.content{padding:28px 28px 55px}.rail{width:226px}.topbar{padding:0 28px}}
@media(max-width:950px){.rail{width:82px;padding:19px 8px}.brand{padding:0 10px 20px}.brand span,.menu-group,.rail-bottom{display:none}.nav{font-size:0;justify-content:center;padding:14px 8px;border-left:0;border-bottom:3px solid transparent}.nav svg{width:22px;height:22px}.nav.selected{border-left:0;border-bottom-color:var(--orange)}.topbar{padding:0 22px}.content{padding:24px 22px 55px}.tilegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile:after{display:none}.tile{padding:14px;gap:9px}.tile b{font-size:12px}.tile-icon{width:40px;height:40px}.tile small{font-size:10px}.quotegrid,.detailgrid{grid-template-columns:1fr}}
@media(max-width:690px){.shell{display:block}.rail{height:auto;position:static;width:100%;flex-direction:row;padding:8px 12px;gap:8px;overflow:auto;align-items:center}.brand{display:none}.nav{font-size:12px;flex:1;justify-content:center;padding:10px 8px;border-radius:8px;white-space:nowrap;gap:6px}.nav svg{width:16px;height:16px}.topbar{height:60px;padding:0 15px}.topbar .path{display:none}.top-actions{gap:7px}.top-actions .system-tag{display:none}.profile{min-width:112px;font-size:11px}.content{padding:18px 14px 45px}.hero{padding:24px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:17px}.hero h1{font-size:25px}.hero p{font-size:12px}.hero .button{margin:0}.metricgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:14px;min-height:104px}.metric div{font-size:26px}.tilegrid{grid-template-columns:1fr;gap:10px;margin-bottom:20px}.tile{padding:13px 15px;min-height:70px}.tile-icon{height:42px;width:42px}.tile small{display:block}.dashboard-side{grid-template-columns:1fr}.section-head{flex-wrap:wrap}.section-head h1{font-size:24px}.searchrow,.searchrow input{width:100%}.tablebox{overflow-x:auto}.tablebox table{min-width:660px}.modal-head,.modal-body{padding:17px}.steps{grid-template-columns:repeat(3,1fr)!important}.fields2,.fields3,.docActions,.operation-choices{grid-template-columns:1fr}.quotegrid{grid-template-columns:1fr}}
@media print{.hero,.shell,.modal-cover{display:none!important}}

function addClient(fromTicket=false){modal='client';modalShow(`<div class="modal-head"><div><div class="eyebrow">CLIENTES</div><h2>Nuevo cliente</h2><p class="small">Identificación del cliente</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="fields2"><div class="field"><label>Tipo de documento</label><select id="client-type"><option value="ruc">RUC (11 dígitos)</option><option value="dni">DNI (8 dígitos)</option></select></div><div class="field"><label>Número de documento</label><input id="client-id" placeholder="Ingresa el número" inputmode="numeric" oninput="checkClientMatch()"></div></div><div class="field"><label>Razón social / nombre</label><input id="client-name" placeholder="Nombre legal del cliente" oninput="checkClientMatch()"></div><div class="fields2"><div class="field"><label>Persona de contacto</label><input id="client-contact"></div><div class="field"><label>Teléfono</label><input id="client-phone"></div></div><div class="field"><label>Correo</label><input type="email" id="client-email"></div><div id="client-warning" class="hint" style="display:none"></div><div class="row between"><span class="small muted">Registro único por documento</span><button class="button" onclick="saveClient(${fromTicket})">Guardar cliente</button></div></div>`,true)}
function checkClientMatch(){let id=document.getElementById('client-id').value.replace(/\D/g,''),name=document.getElementById('client-name').value;let duplicate=db.clients.find(c=>c.id===id),similar=db.clients.find(c=>nameLooksLike(c.name,name)&&name.trim().length>=7);let warn=document.getElementById('client-warning');warn.style.display=duplicate||similar?'block':'none';warn.textContent=duplicate?'Este documento ya está registrado como '+duplicate.name+'. No se puede duplicar.':similar?'Existe un cliente con nombre similar: '+similar.name+'. Verifica antes de guardar.':''}
function saveClient(back){let type=document.getElementById('client-type').value,id=document.getElementById('client-id').value.replace(/\D/g,''),name=document.getElementById('client-name').value.trim().toUpperCase();if(id.length!==(type==='ruc'?11:8)||name.length<3)return toast('Revisa el número de documento y el nombre.');if(type==='ruc'&&!checkRuc(id))return toast('El RUC tiene un dígito de verificación incorrecto. Revísalo.');if(db.clients.some(c=>c.id===id))return toast('Ese documento ya existe. Usa la ficha registrada.');let dup=db.clients.find(c=>nameLooksLike(c.name,name));if(dup&&!confirm('Ya existe una ficha con nombre similar: '+dup.name+'. ¿Confirmas que es otra persona o empresa?'))return;db.clients.push({id,type,name,contact:document.getElementById('client-contact').value.trim(),phone:document.getElementById('client-phone').value.trim(),email:document.getElementById('client-email').value.trim()});save();toast('Cliente registrado sin duplicar su documento');if(back){newTicket();document.getElementById('new-client').value=id}else closeModal()}
function clientHistory(id){let c=client(id),arr=db.tickets.filter(t=>t.clientId===id).sort((a,b)=>b.id-a.id);modalShow(`<div class="modal-head"><div><div class="eyebrow">HISTORIAL COMERCIAL</div><h2>${esc(c.name)}</h2><p class="small">${c.type==='ruc'?'RUC':'DNI'} ${esc(c.id)} · ${arr.length} servicios registrados</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body">${rowTickets(arr)}<div class="sep"></div><button class="button outline" onclick="closeModal();newTicket();document.getElementById('new-client').value='${esc(c.id)}'">＋ Nuevo ingreso para este cliente</button></div>`)}
function stepsHTML(t){const sale=kindOf(t)==='venta',current=sale?({evaluacion:1,aprobacion:2,entrega:3,documento:4,cerrado:5,rechazado:2})[t.status]||0:({evaluacion:1,aprobacion:2,inicio:3,taller:3,entrega:4,documento:5,cerrado:6,rechazado:2})[t.status]||0;const st=sale?['Solicitud','Cotización','Aprobación','Entrega','Comprobante']:['Ingreso','Evaluar + cotizar','Aprobación','Producción','Entrega','Comprobante'];return `<div class="steps" style="grid-template-columns:repeat(${st.length},minmax(0,1fr))">${st.map((s,i)=>`<div class="step ${i<current?'done':''} ${i===current?'current':''}">${i+1}. ${s}</div>`).join('')}</div>`}
function openTicket(id,nextTab='resumen'){let t=ticket(id);if(!t)return;modal=t.id;tab=nextTab;renderTicketModal()}
function renderTicketModal(){let t=ticket(modal);if(!t)return;let c=client(t.clientId);modalShow(`<div class="modal-head"><div><div class="eyebrow">${esc(kindLabels[kindOf(t)])} · EXPEDIENTE</div><div class="row wrap" style="margin-top:5px"><h2>${cid(t.id)}</h2>${badge(t)}</div><p class="small">${esc(c.name)} · ${esc(t.equipment)}</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body">${stepsHTML(t)}<div class="tabs">${[['resumen','Resumen'],['evaluacion',kindOf(t)==='venta'?'Cotización de venta':'Evaluación + cotización'],...(kindOf(t)==='venta'?[]:[['taller','Taller y entrega']]),['cobro','Comprobante y pago'],['docs','Documentos']].map(([id,label])=>`<button class="${tab===id?'on':''}" onclick="tab='${id}';renderTicketModal()">${label}</button>`).join('')}</div><div id="tab-body">${ticketBody(t)}</div></div>`)}
function renderEvaluationView(t,money){const sale=kindOf(t)==='venta',fab=kindOf(t)==='fabricacion',editable=t.status==='evaluacion';const quoteView=`<div class="splithead"><h3>Detalle de cotización</h3>${editable?'<button class="button outline sm" onclick="addLine()">＋ Añadir partida</button>':''}</div><div class="tablebox"><table class="quote-table"><thead><tr><th>Descripción</th><th>Cant.</th><th>Precio sin IGV</th><th></th></tr></thead><tbody>${t.quote.lines.map((l,i)=>`<tr><td><input class="desc" id="ld${i}" value="${esc(l.desc)}" ${editable?'':'disabled'} onchange="updateLine(${i})"></td><td><input type="number" id="lq${i}" min=".01" step=".01" value="${Number(l.qty)}" ${editable?'':'disabled'} onchange="updateLine(${i})"></td><td><input type="number" id="lp${i}" min="0" step=".01" value="${Number(l.price)}" ${editable?'':'disabled'} onchange="updateLine(${i})"></td><td>${editable?`<button class="button ghost sm" onclick="removeLine(${i})">✕</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4" class="small muted">Sin partidas registradas</td></tr>'}</tbody></table></div><div class="quotegrid" style="margin-top:14px"><div><div class="fields2"><div class="field"><label>Descuento en soles</label><input type="number" id="q-discount" min="0" step="0.01" value="${t.quote.discount||0}" ${editable?'':'disabled'} onchange="updatePrice()"></div><div class="field"><label>Precio final negociado (con IGV)</label><input type="number" id="q-gross" min="0" step="0.01" placeholder="Opcional" value="${t.quote.gross??''}" ${editable?'':'disabled'} onchange="updatePrice()"></div></div><div class="field"><label>Condiciones comerciales y garantía aplicable</label><textarea id="q-terms" ${editable?'':'disabled'} oninput="draftInput()">${esc(t.quote.terms)}</textarea></div></div><div class="detail"><div class="totalrow"><span>Base imponible</span><b>${fmt(money.base)}</b></div><div class="totalrow"><span>IGV 18%</span><b>${fmt(money.igv)}</b></div><div class="totalrow big"><span>TOTAL</span><span>${fmt(money.gross)}</span></div>${money.adjust?`<small class="muted">Ajuste por precio negociado: ${fmt(money.adjust)}</small>`:''}</div></div>`;
const commonActions=`<div class="row wrap" style="margin-top:15px">${editable?`<button class="button" onclick="sendQuote()">${sale?'Enviar cotización a aprobación':'Enviar cotización'} →</button>`:''}${!sale?`<button class="button outline" onclick="docPrint('eval')">↓ PDF evaluación</button>`:''}<button class="button outline" onclick="docPrint('quote')">↓ Generar PDF cotización</button></div>`;
if(!editable)return `<div class="hint goodhint">${sale?'Cotización registrada':'Evaluación y cotización registradas'}</div>${sale?'':`<div class="detail"><b>Observaciones:</b> ${esc(t.eval.findings||'---')}<br><b>Correcciones:</b> ${esc(t.eval.fixes||'---')}</div><div class="sep"></div>`}${quoteView}${commonActions}`;
const saleForm=`<div class="hint">Venta de producto · Disponibilidad por confirmar</div><div class="field"><label>Catálogo de productos</label><div class="row wrap"><select id="sale-preset" style="flex:1;min-width:230px"><option value="">Seleccionar producto...</option><option value="radiador451">451 · Radiador importado Freightliner Century</option></select><button class="button soft" onclick="applySalePreset()">Usar producto</button></div></div><div class="detail"><b>Producto:</b> ${esc(t.equipment)}<br><b>Código:</b> ${esc(t.productCode||'Pendiente de identificar')}<br><b>Disponibilidad:</b> por confirmar</div>`;
const technicalForm=`<div class="hint">${fab?'Especificaciones de fabricación':'Diagnóstico técnico'}</div><div class="fields2"><div class="field"><label>Condiciones de ingreso</label><textarea id="ev-condition" oninput="draftInput()">${esc(t.eval.condition)}</textarea></div><div class="field"><label>${fab?'Especificaciones y medidas detectadas':'Observaciones del técnico'}</label><textarea id="ev-findings" oninput="draftInput()" placeholder="${fab?'Dimensiones, planos, material y requerimientos':'Ej.: fuga visible en panal del intercooler'}">${esc(t.eval.findings)}</textarea></div></div><div class="field"><label>Procedimiento técnico</label><div class="row wrap"><select id="tech-preset" style="flex:1;min-width:240px"><option value="">Seleccionar procedimiento...</option>${Object.entries(TECH_PRESETS).map(([key,x])=>`<option value="${key}">${esc(x.name)}</option>`).join('')}</select><button class="button soft" onclick="applyTechnicalPreset()">Agregar propuesta</button></div><p class="small" style="margin:5px 0"></p></div><div class="field"><label>Corrección o procedimiento propuesto</label><textarea id="ev-fixes" oninput="draftInput()" placeholder="Procesos técnicos aplicables y aprobados">${esc(t.eval.fixes)}</textarea></div><div class="field"><label>Evidencia fotográfica (opcional)</label><input type="file" accept="image/*" id="ev-photo" onchange="addPhoto(this)"><div class="photo-row">${t.eval.photos.map(src=>`<img src="${src}" alt="Evidencia">`).join('')}</div></div>`;
return `${sale?saleForm:technicalForm}<div class="sep"></div>${quoteView}${commonActions}`}
function applyTechnicalPreset(){const t=ticket(modal),key=document.getElementById('tech-preset')?.value,p=TECH_PRESETS[key];if(!p||t.status!=='evaluacion')return;const notes=document.getElementById('ev-fixes');if(notes?.value.trim()&&!confirm('¿Reemplazar los procedimientos propuestos?'))return;t.eval.fixes=p.text;if(!t.quote.lines.length){t.quote.lines.push({desc:p.name,qty:1,price:p.price})}save();tab='evaluacion';renderTicketModal();toast('Plantilla aplicada: revisa procedimientos y precios antes de cotizar.')}
function applySalePreset(){const t=ticket(modal),key=document.getElementById('sale-preset')?.value,p=SALE_PRESETS[key];if(!p||t.status!=='evaluacion')return;if(t.quote.lines.length&&!confirm('¿Reemplazar las partidas actuales con el producto seleccionado?'))return;t.equipment=p.equipment;t.productCode=p.code;t.quote.lines=[{desc:p.description,qty:1,price:p.price}];t.quote.discount=0;t.quote.gross=null;t.quote.terms=p.terms;save();tab='evaluacion';renderTicketModal();toast('Producto cargado; revisa precio, disponibilidad y condiciones.')}
function ticketBody(t){let c=client(t.clientId),money=calc(t);if(tab==='resumen')return `<div class="detailgrid"><div class="detail"><div class="eyebrow">ESTADO DEL SERVICIO</div><h2 style="margin:8px 0 8px">${esc(kindOf(t)==='venta'&&t.status==='evaluacion'?'Pendiente cotización':labels[t.status])}</h2><p>Siguiente etapa: <b>${esc(next(t))}</b>.</p><div class="sep"></div><dl><dt>Cliente</dt><dd>${esc(c.name)} · ${esc(c.id)}</dd><dt>Equipo</dt><dd>${esc(t.equipment)}</dd><dt>Serie / placa</dt><dd>${esc(t.serial||'No registrada')}</dd><dt>Ingreso</dt><dd>${esc(t.received)}</dd><dt>Importe cotizado</dt><dd>${t.quote.lines.length?fmt(money.gross):'Pendiente'}</dd></dl>${t.status==='evaluacion'?`<button class="button" onclick="tab='evaluacion';renderTicketModal()">${kindOf(t)==='venta'?'Preparar cotización de venta':'Evaluar y cotizar'} →</button>`:''}${t.status==='aprobacion'?`<div class="row wrap"><button class="button green" onclick="approveTicket()">✓ Cliente aprobó</button><button class="button outline" onclick="rejectTicket()">No aprobó</button></div>`:''}${t.status==='inicio'?`<button class="button" onclick="tab='taller';renderTicketModal()">Crear / iniciar OT →</button>`:''}${['taller','entrega'].includes(t.status)?`<button class="button" onclick="${kindOf(t)==='venta'?'deliver()':"tab='taller';renderTicketModal()"}">${kindOf(t)==='venta'?'Confirmar entrega del producto':'Continuar con taller'} →</button>`:''}${t.status==='documento'?`<button class="button" onclick="tab='cobro';renderTicketModal()">Registrar comprobante y cobro →</button>`:''}${t.status==='cerrado'?'<span class="tag green">✓ Expediente cerrado</span>':''}</div><div class="detail"><h3>Historial de movimientos</h3><div class="timeline">${t.events.map(e=>`<div class="event"><b>${esc(e.text)}</b><small>${esc(e.at)} · ${esc(e.who)}</small></div>`).join('')}</div></div></div>`;
if(tab==='evaluacion')return renderEvaluationView(t,money);
if(tab==='taller')return `<h3>Orden de trabajo</h3><p class="sub">Actividades autorizadas</p><div class="detail" style="margin-top:15px"><b>Trabajo aprobado</b><p style="margin-top:8px">${esc(t.eval.fixes||'Pendiente de evaluación')}</p>${t.quote.lines.length?`<ul>${t.quote.lines.map(l=>`<li>${esc(l.desc)} · Cant. ${l.qty}</li>`).join('')}</ul>`:''}</div>${t.status==='inicio'?`<div class="field" style="margin-top:16px"><label>Responsable de taller</label><input id="responsible" value="${esc(t.work.responsible)}" placeholder="Nombre del técnico"></div><button class="button" onclick="startWork()">Iniciar trabajo</button>`:''}${t.status==='taller'?`<div style="margin-top:17px"><label>Control de calidad completado</label><label class="row" style="color:#333;font-size:13px"><input type="checkbox" style="width:auto" id="qc" ${t.work.qc?'checked':''} onchange="qcChange(this.checked)"> Prueba de presión e inspección final realizadas</label><div class="row wrap"><button class="button" onclick="finishWork()">Finalizar trabajo → pendiente de entrega</button><button class="button outline" onclick="docPrint('ot')">PDF orden de trabajo</button></div></div>`:''}${t.status==='entrega'?`<div class="hint goodhint">Trabajo finalizado. Falta registrar la entrega al cliente.</div><button class="button" onclick="deliver()">Confirmar entrega del equipo</button>`:''}${!['inicio','taller','entrega'].includes(t.status)?`<div class="hint">La orden de trabajo se habilita al aprobar la cotización. Estado actual: ${esc(kindOf(t)==='venta'&&t.status==='evaluacion'?'Pendiente cotización':labels[t.status])}.</div>`:''}`;
if(tab==='cobro')return `<div class="hint">Factura y boleta son ambos comprobantes. Registro del comprobante emitido externamente. No realiza emisión electrónica.</div>${t.status==='documento'||t.status==='cerrado'?`<div class="fields2"><div class="field"><label>Tipo de comprobante</label><select id="doc-type" ${t.status==='cerrado'?'disabled':''}><option value="">Seleccionar...</option><option value="FACTURA" ${t.doc.type==='FACTURA'?'selected':''}>Factura</option><option value="BOLETA" ${t.doc.type==='BOLETA'?'selected':''}>Boleta de venta</option></select></div><div class="field"><label>Serie y correlativo real</label><input id="doc-number" value="${esc(t.doc.number)}" placeholder="Ej.: F001-0000123" ${t.status==='cerrado'?'disabled':''}></div></div><div class="detail"><div class="totalrow"><span>Total del servicio</span><b>${fmt(money.gross)}</b></div><div class="totalrow"><span>Abonos registrados</span><b>${fmt(t.paid)}</b></div><div class="totalrow big"><span>Saldo pendiente</span><b>${fmt(Math.max(0,round(money.gross-t.paid)))}</b></div></div>${t.status!=='cerrado'?`<div class="fields2" style="margin-top:15px"><div class="field"><label>Nuevo pago recibido (S/)</label><input type="number" id="payment-amount" min="0" step=".01" value="0"></div><div class="field"><label>Fecha del comprobante</label><input type="date" id="doc-date" value="${esc(t.doc.date||iso())}"></div></div><button class="button" onclick="registerPayment()">Guardar comprobante y pago</button><p class="small" style="margin-top:8px">Si el saldo llega a cero y hay comprobante registrado, el servicio se cierra automáticamente.</p>`:'<div class="hint goodhint">Servicio cerrado y totalmente cobrado.</div>'}`:`<div class="hint">Pendiente de entrega.</div>`}`;
return `<h3>Documentos del expediente</h3><p class="sub">Todas las salidas se generan desde la misma información, sin digitar nuevamente.</p><div class="docActions" style="margin-top:16px">${kindOf(t)==='venta'?'':`<button class="button outline" onclick="docPrint('eval')">↓ &nbsp; Descargar evaluación PDF</button>`}<button class="button outline" onclick="docPrint('quote')">↓ &nbsp; Generar cotización PDF</button><button class="button outline" onclick="docPrint('ot')" ${(kindOf(t)==='venta'||!['inicio','taller','entrega','documento','cerrado'].includes(t.status))?'disabled':''}>↓ &nbsp; Descargar orden de trabajo PDF</button><button class="button outline" onclick="prepareEmail()" ${!t.quote.lines.length?'disabled':''}>✉ &nbsp; Preparar correo administrativo</button></div><div class="detail" style="margin-top:17px"><h3>Comprobante de pago</h3><p style="margin-top:9px">${t.doc.type?esc(t.doc.type)+' · '+esc(t.doc.number):'Aún no registrado'}</p><p class="small" style="margin-top:8px">El número de factura o boleta se asocia al servicio cuando se emite en el sistema tributario correspondiente.</p></div>`}
function draftInput(){let t=ticket(modal);if(!t||t.status!=='evaluacion')return;for(const [id,key] of [['ev-condition','condition'],['ev-findings','findings'],['ev-fixes','fixes']]){let e=document.getElementById(id);if(e)t.eval[key]=e.value}let terms=document.getElementById('q-terms');if(terms)t.quote.terms=terms.value;save()}
function addPhoto(input){let t=ticket(modal),f=input.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Selecciona una imagen.');const reader=new FileReader();reader.onload=e=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas'),scale=Math.min(1,850/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);t.eval.photos.push(canvas.toDataURL('image/jpeg',.62));try{save();renderTicketModal()}catch(er){t.eval.photos.pop();toast('No se pudo guardar la fotografía. Reduce el tamaño del archivo.')} };img.src=e.target.result};reader.readAsDataURL(f)}
function addLine(){let t=ticket(modal);t.quote.lines.push({desc:t.eval.fixes?'Reparación: '+t.eval.fixes:'Servicio de radiador',qty:1,price:0});save();renderTicketModal()}
function removeLine(i){let t=ticket(modal);t.quote.lines.splice(i,1);save();renderTicketModal()}
function refreshQuoteSummary(){
  const el=document.querySelector('#tab-body .quotegrid .detail');if(!el)return;
  const money=calc(ticket(modal));el.innerHTML=`<div class="totalrow"><span>Base imponible</span><b>${fmt(money.base)}</b></div><div class="totalrow"><span>IGV 18%</span><b>${fmt(money.igv)}</b></div><div class="totalrow big"><span>TOTAL</span><span>${fmt(money.gross)}</span></div>${money.adjust?`<small class="muted">Ajuste por precio cerrado: ${fmt(money.adjust)}</small>`:''}`;
}
function updateLine(i){let t=ticket(modal),d=document.getElementById('ld'+i),q=document.getElementById('lq'+i),p=document.getElementById('lp'+i);t.quote.lines[i]={desc:d.value.trim(),qty:Number(q.value)||0,price:round(p.value)};t.quote.gross=null;let gross=document.getElementById('q-gross');if(gross)gross.value='';save();refreshQuoteSummary()}
function updatePrice(){let t=ticket(modal);t.quote.discount=round(document.getElementById('q-discount').value);let total=document.getElementById('q-gross').value;t.quote.gross=total.trim()===''?null:round(total);save();refreshQuoteSummary()}
function updateTerms(){ticket(modal).quote.terms=document.getElementById('q-terms').value;save()}
function sendQuote(){let t=ticket(modal);if(t.status!=='evaluacion')return;for(const [id,key] of [['ev-condition','condition'],['ev-findings','findings'],['ev-fixes','fixes']]){let e=document.getElementById(id);if(e)t.eval[key]=e.value.trim()}let terms=document.getElementById('q-terms');if(terms)t.quote.terms=terms.value.trim();const technical=kindOf(t)!=='venta';if((technical&&(!t.eval.findings||!t.eval.fixes))||!t.quote.lines.length||t.quote.lines.some(l=>!l.desc||l.qty<=0||l.price<0))return toast('Faltan especificaciones técnicas o partidas de cotización válidas.');if(calc(t).gross<=0)return toast('La cotización debe tener importe positivo.');t.status='aprobacion';t.quote.number=t.quote.number||'COT-'+String(t.id).padStart(3,'0');event(t,(technical?'Evaluación registrada y ':'')+'Cotización lista para aprobación.');save();toast('Cotización preparada. Espera la aceptación del cliente.');tab='resumen';renderTicketModal()}
function approveTicket(){let t=ticket(modal);if(t.status!=='aprobacion')return;let who=prompt('¿Quién aprobó la cotización? (nombre y cargo)');if(!who?.trim())return;let proof=prompt('Evidencia de aprobación (correo, WhatsApp, OC, firma):','Correo')||'No especificada';t.approval={who:who.trim(),proof,at:now(),version:t.quote.version};t.status=kindOf(t)==='venta'?'entrega':'inicio';event(t,'Cotización aprobada por '+who.trim()+'. '+(kindOf(t)==='venta'?'Venta pendiente de entrega.':'Trabajo pendiente de inicio.'));save();tab='resumen';renderTicketModal()}
function rejectTicket(){let t=ticket(modal);if(t.status!=='aprobacion')return;let why=prompt('Motivo del rechazo (obligatorio):');if(!why?.trim())return;t.status='rechazado';t.rejection=why.trim();event(t,'Cotización no aprobada: '+why.trim());save();tab='resumen';renderTicketModal()}
function startWork(){let t=ticket(modal),resp=document.getElementById('responsible').value.trim();if(!resp)return toast('Ingresa el responsable del trabajo.');t.work.responsible=resp;t.work.start=now();t.status='taller';event(t,'Orden de trabajo iniciada. Responsable: '+resp);save();tab='taller';renderTicketModal()}
function qcChange(checked){ticket(modal).work.qc=checked;save()}
function finishWork(){let t=ticket(modal);if(!t.work.qc)return toast('Primero confirma el control de calidad.');t.status='entrega';t.work.finished=now();event(t,'Reparación terminada y control de calidad aprobado. Pendiente de entrega.');save();tab='resumen';renderTicketModal()}
function deliver(){let t=ticket(modal);if(t.status!=='entrega')return;t.status='documento';t.work.delivered=now();event(t,'Equipo entregado al cliente. Pendiente de comprobante y cobro.');save();tab='cobro';renderTicketModal()}
function registerPayment(){let t=ticket(modal),ty=document.getElementById('doc-type').value,num=document.getElementById('doc-number').value.trim().toUpperCase(),date=document.getElementById('doc-date').value,amount=round(document.getElementById('payment-amount').value);if(!ty||!/^[FB][A-Z0-9]{3}-\d{1,8}$/.test(num))return toast('Selecciona factura/boleta e ingresa serie y número válidos (ej.: F001-0000123).');if((ty==='FACTURA'&&!num.startsWith('F'))||(ty==='BOLETA'&&!num.startsWith('B')))return toast('La serie debe empezar con F para factura y B para boleta.');if(ty==='FACTURA'&&client(t.clientId).type!=='ruc')return toast('Para registrar factura, el cliente debe tener RUC.');if(db.tickets.some(x=>x.id!==t.id&&x.doc.number===num))return toast('El correlativo de comprobante ya existe en otro servicio.');let due=Math.max(0,round(calc(t).gross-t.paid));if(amount<0||amount>due)return toast('El pago no puede superar el saldo ni ser negativo.');t.doc={type:ty,number:num,date};t.paid=round(t.paid+amount);if(t.paid>=calc(t).gross){t.status='cerrado';event(t,'Comprobante registrado y servicio totalmente cobrado: '+ty+' '+num+'.')}else event(t,'Comprobante '+ty+' '+num+' registrado. Abono: '+fmt(amount)+'. Pendiente: '+fmt(calc(t).gross-t.paid));save();tab='cobro';renderTicketModal()}
function docPrintLegacy(kind){if(tab==='evaluacion'&&ticket(modal)?.status==='evaluacion')draftInput();let t=ticket(modal);if(!t)return; if(kind==='ot'&&!['inicio','taller','entrega','documento','cerrado'].includes(t.status))return toast('La orden se genera después de aprobar el trabajo.');let c=client(t.clientId),val=calc(t),title=kind==='quote'?'COTIZACIÓN':kind==='eval'?'EVALUACIÓN TÉCNICA':'ORDEN DE TRABAJO',code=kind==='quote'?(t.quote.number||cid(t.id))+' · V'+String(t.quote.version).padStart(2,'0'):kind==='eval'?'EVA-'+String(t.id).padStart(3,'0'):'OT-'+String(t.id).padStart(3,'0');let head=`<div class="paperhead"><div style="display:flex;gap:11px;align-items:center"><img class="paperlogo" src="${LOGO}"><div><div class="paperbrand">LEXSAN RADIADORES S.A.C.</div><div class="papersub">RUC 20614867443 · Arequipa, Perú<br>Ingeniería térmica · Reparación y mantenimiento de radiadores</div></div></div><div><div class="papertitle">${title}</div><div style="text-align:right">${esc(code)}<br>Fecha: ${iso()}</div></div></div><div class="paperflex"><div class="paperbox"><b>CLIENTE</b><br>${esc(c.name)}<br>${c.type==='ruc'?'RUC':'DNI'}: ${esc(c.id)}<br>Contacto: ${esc(c.contact||'—')}</div><div class="paperbox"><b>EQUIPO</b><br>${esc(t.equipment)}<br>Serie/placa: ${esc(t.serial||'—')}<br>Servicio: ${cid(t.id)}</div></div>`;let body='';if(kind==='quote'){body=`<table><thead><tr><th>DESCRIPCIÓN</th><th>CANTIDAD</th><th>P. UNITARIO</th><th>IMPORTE</th></tr></thead><tbody>${t.quote.lines.map(l=>`<tr><td>${esc(l.desc)}</td><td>${l.qty}</td><td>${fmt(l.price)}</td><td>${fmt(round(l.price*l.qty))}</td></tr>`).join('')}${val.adjust?`<tr><td>Ajuste por precio cerrado</td><td>1</td><td>${fmt(val.adjust)}</td><td>${fmt(val.adjust)}</td></tr>`:''}</tbody></table><div class="papertotals"><div><span>Subtotal</span><b>${fmt(val.sum)}</b></div><div><span>Descuento</span><b>${fmt(val.discount)}</b></div><div><span>Base imponible</span><b>${fmt(val.base)}</b></div><div><span>IGV 18%</span><b>${fmt(val.igv)}</b></div><div class="final"><span>TOTAL</span><b>${fmt(val.gross)}</b></div></div><div class="papersection"><h3>CONDICIONES COMERCIALES</h3><p>${esc(t.quote.terms)}</p></div><div style="font-size:10px;margin-top:22px">La presente es una cotización comercial y no un comprobante de pago.</div>`}else if(kind==='eval'){body=`<div class="papersection"><h3>CONDICIONES DE RECEPCIÓN</h3><p>${esc(t.eval.condition||'—')}</p></div><div class="papersection"><h3>OBSERVACIONES DETECTADAS</h3><p>${esc(t.eval.findings||'Pendientes de completar')}</p></div><div class="papersection"><h3>CORRECCIONES RECOMENDADAS</h3><p>${esc(t.eval.fixes||'Pendientes de completar')}</p></div><div class="papersection"><h3>EVIDENCIA FOTOGRÁFICA</h3>${t.eval.photos.length?t.eval.photos.map(src=>`<img class="paperphoto" src="${src}">`).join(' '):'Sin fotografías adjuntas'}</div>`}else{body=`<h3>TRABAJO AUTORIZADO</h3><p>Cliente aprobó: ${esc(t.approval?.who||'Pendiente')} · Evidencia: ${esc(t.approval?.proof||'—')}</p><ul class="paperlist">${t.quote.lines.map(l=>`<li>${esc(l.desc)} · Cantidad ${l.qty}</li>`).join('')}</ul><div class="papersection"><h3>INSTRUCCIONES TÉCNICAS</h3><p>${esc(t.eval.fixes)}</p></div><div class="papersection"><h3>CONTROL DE CALIDAD</h3><p>□ Inspección visual &nbsp;&nbsp; □ Prueba hidrostática &nbsp;&nbsp; □ Conformidad técnica</p><p style="margin-top:25px">_____________________________ &nbsp; _____________________________<br>Responsable de taller &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Control de calidad</p></div>`}document.getElementById('paper').innerHTML=head+body+`<div class="paperfooter">LEXSAN RADIADORES S.A.C. · Documento comercial / técnico</div>`;setTimeout(()=>window.print(),80)}

    } else{pdf.text('Continuación · '+cid(t.id),44,122,9,false,PDF_GRAY);y=142}
  }
  function footer(){

  function room(height){if(y+height>772){footer();header(true)}}

  function paragraph(s,size=9.3,lineHeight=13){const arr=pdf.lines(s,490,size);for(const line of arr){room(lineHeight+4);pdf.text(line,48,y+10,size);y+=lineHeight}y+=6}
  header();
  if(kind==='quote'){
    title(kindOf(t)==='venta'?'PRODUCTO COTIZADO':'DETALLE ECONÓMICO DEL SERVICIO');
    function tableHeader(){pdf.rect(mLeft,y,tableWidth,26,PDF_BLACK);pdf.text('DESCRIPCIÓN / ALCANCE',54,y+17,8.4,true,[1,1,1]);pdf.text('CANT.',365,y+17,8.4,true,[1,1,1],'right');pdf.text('P. UNITARIO',451,y+17,8.4,true,[1,1,1],'right');pdf.text('IMPORTE',539,y+17,8.4,true,[1,1,1],'right');y+=26}
    tableHeader();
    for(const item of t.quote.lines){const desc=pdf.lines(item.desc,292,9.3),rowH=Math.max(29,desc.length*13+13);

      pdf.rect(mLeft,y,tableWidth,rowH,([0.997,0.997,0.997]));pdf.line(mLeft,y+rowH,mRight,y+rowH,[.90,.90,.90]);

    }
    if(v.adjust){room(36);pdf.text('Ajuste de precio negociado',54,y+18,9.1);pdf.text(fmt(v.adjust),539,y+18,9.1,false,PDF_BLACK,'right');pdf.line(44,y+31,551,y+31,[.89,.89,.89]);y+=35}
    y+=16;room(141);
    function moneyRow(label,value,bold=false){pdf.text(label,396,y+14,9.3,bold);pdf.text(fmt(value),539,y+14,9.3,bold,PDF_BLACK,'right');y+=22}

    pdf.rect(387,y,164,35,PDF_ORANGE);pdf.text('TOTAL',398,y+23,10.5,true,[1,1,1]);pdf.text(fmt(v.gross),541,y+23,12,true,[1,1,1],'right');y+=46;
    title('CONDICIONES COMERCIALES');
    paragraph(t.quote.terms||'Condiciones comerciales por confirmar.');
    room(45);pdf.rect(44,y+8,507,41,[1,.976,.958]);pdf.text('IMPORTANTE',54,y+23,8,true,PDF_ORANGE);pdf.text('Esta cotización no constituye comprobante de pago ni autorización de trabajo.',54,y+37,8.5);y+=54;
    if(t.eval.fixes?.trim()){
      if(y+75>748){footer();header(true)}
      title('ALCANCE TÉCNICO RECOMENDADO');
      paragraph(t.eval.fixes,8.9,12.5);
    }
    footer();
  }else if(kind==='eval'){
    title('DIAGNÓSTICO Y EVALUACIÓN DEL RADIADOR');
    for(const [name,body] of [['CONDICIONES DE RECEPCIÓN',t.eval.condition],['OBSERVACIONES DEL TÉCNICO',t.eval.findings],['CORRECCIONES RECOMENDADAS',t.eval.fixes]]){

    room(75);pdf.line(60,y+52,245,y+52);pdf.line(332,y+52,530,y+52);pdf.text('Responsable de taller',112,y+68,8.5,false,PDF_GRAY);pdf.text('Control de calidad',380,y+68,8.5,false,PDF_GRAY);footer();
  }
  return pdf.output()
}
function pdfDownload(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function docPrint(kind){
  try{
    const t=ticket(modal);if(!t){toast('Selecciona primero un servicio.');return}
    if(tab==='evaluacion'&&t.status==='evaluacion')draftInput();
    if(kind!=='quote'&&kindOf(t)==='venta'){toast('La venta de producto no requiere evaluación ni orden de reparación.');return}if(kind==='quote'&&(!t.quote.lines.length||t.quote.lines.some(x=>!x.desc||!Number(x.qty)||Number(x.price)<0))){toast('Añade partidas con cantidad y precio antes de generar la cotización.');return}
    if(kind==='ot'&&!['inicio','taller','entrega','documento','cerrado'].includes(t.status)){toast('Primero debes registrar la aprobación del cliente.');return}
    const b=buildLexsanPDF(t,client(t.clientId),kind);
    const label=kind==='quote'?'Cotizacion':kind==='eval'?'Evaluacion':'Orden_Trabajo';
    const number=(t.quote.number||cid(t.id)).replace(/[^a-zA-Z0-9-]/g,'_');
    pdfDownload(b,`LEXSAN_${label}_${number}_Servicio_${String(t.id).padStart(3,'0')}.pdf`);
    toast('PDF descargado correctamente. Revisa tu carpeta Descargas.');
  }catch(err){console.error('Error generando PDF',err);toast('No se pudo crear el PDF: '+String(err.message||err))}
}
function downloadSampleSale(){try{const t=ticket(92);if(!t)throw new Error('No existe la venta de ejemplo.');pdfDownload(buildLexsanPDF(t,client(t.clientId),'quote'),'LEXSAN_Venta_256-26_Freightliner_Century.pdf');toast('PDF de venta descargado.')}catch(err){console.error(err);toast('No se pudo generar el PDF de venta: '+err.message)}}
function downloadSampleQuote(){
  try{
    let t=ticket(89)||db.tickets.find(x=>x.quote.lines.length>0);
    if(!t){toast('No hay cotizaciones de muestra.');return}
    if(!t.quote.lines.length)t=db.tickets.find(x=>x.quote.lines.length>0)||t;
    if(!t.quote.lines.length){toast('Agrega primero un servicio con precio.');return}
    const b=buildLexsanPDF(t,client(t.clientId),'quote');
    pdfDownload(b,`LEXSAN_Cotizacion_${String(t.quote.number||t.id).replace(/[^a-zA-Z0-9-]/g,'_')}.pdf`);
    toast('Cotización PDF generada y descargada.');
  }catch(err){console.error(err);toast('Error al generar la muestra: '+String(err.message||err))}
}
